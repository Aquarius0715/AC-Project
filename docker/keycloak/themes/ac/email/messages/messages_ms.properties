passwordResetBody=Seseorang baru sahaja meminta untuk menukar bukti kelayakan akaun {2} anda. Jika ini anda, klik pautan di bawah untuk menetapkannya semula.\n\n{0}\n\nPautan dan kod ini akan tamat tempoh dalam masa {3}.\n\nJika anda tidak mahu menetapkan semula bukti kelayakan anda, abaikan mesej ini dan tiada apa yang akan diubah.
