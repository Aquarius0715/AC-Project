# Local MQTT broker standing in for AWS IoT Core (container-design §4).
# Topics follow backend-architecture §9: t/<tenantId>/d/<deviceId>/{telemetry,heartbeat,event,cmd,cmd/ack,fw,fw/status}
listener 1883 0.0.0.0
# no anonymous client: the broker refuses a connection without one of the users in passwd (security loop, IR413)
allow_anonymous false
password_file /mosquitto/config/passwd
persistence false
log_dest stdout
