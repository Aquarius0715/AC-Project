# AC Project — everything runs in Docker (IR119, DEC-70, docs/02-design/container-design.md)
# Services live under service/: Go in service/api (cmd/{api,worker,migrate} + internal, service/api/build/*.Dockerfile,
# IR174/IR179) and four Next.js apps, one per entry point, in service/web/{customer,partner,technician,admin} on ports
# 3000–3003 with shared code in service/web/shared (service/web/Dockerfile, IR178/IR179)
#
# Profiles
#   demo     Phase 1A clickable demo (4 web apps with the in-browser mock)     docker compose --profile demo up
#   infra    Local stand-ins for the AWS managed services                      docker compose --profile infra up
#   schema   migrate once (schema, local login, demo fixture)                 docker compose --profile infra --profile schema up
#   backend  Core API gateway + 5 domain services, workers, IoT bridge, device simulator (service/api/cmd)
#   full     4 web apps in API mode + backend + infra                         docker compose --profile full up
#   obs      OpenTelemetry collector + Jaeger
#
# Production runs the same application images on ECS Fargate; databases, queues and IoT are AWS managed
# services there (backend-architecture §3a). Nothing in this file is used in production.

name: ac-project

x-worker: &worker             # cmd/worker (independent service, IR166/IR174)
  image: ac-worker:dev
  build:
    context: ./service/api
    dockerfile: build/worker.Dockerfile
    target: runtime
  environment:
    DATABASE_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    DEMO_OPS: "1"                                       # scenario clock shared with the API (platform.demo_clock, IR168)
  read_only: true
  security_opt: [no-new-privileges:true]
  networks: [app, data]
  restart: unless-stopped
  profiles: [backend, full]
  depends_on:
    migrate: { condition: service_completed_successfully }

x-backend: &backend          # Core API business-domain services (service/api/cmd/<service>, build/service.Dockerfile, IR180)
  env_file:
    - path: .env.local
      required: false
  environment: &backend-env
    APP_ENV: local
    DEMO_OPS: "1"                                       # demo.advanceClock / demo.trigger (IR154); never set in production
    DATABASE_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    DATABASE_READER_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    AWS_REGION: ap-southeast-5
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    OIDC_ISSUER: http://localhost:8081/realms/ac          # must equal the iss claim seen by browsers
    OIDC_JWKS_URL: http://keycloak:8080/realms/ac/protocol/openid-connect/certs
    OIDC_ADMIN_CLIENT_ID: ac-admin-web
    OIDC_APP_CLIENT_ID: ac-web
    MQTT_URL: tcp://mosquitto:1883
    STRIPE_API_BASE: http://stripe-mock:12111
    WEATHER_API_BASE: http://weather-mock:8080          # WireMock GET /v1/current
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    INTERNAL_API_TOKEN: local-internal-token-change-me   # service-to-service calls (identity principal, IR181)
    IDENTITY_INTERNAL_URL: http://identity-api:8080      # ignored by identity-api itself
    # internal queries between the services (IR190, IR193); a service never calls itself
    IDENTITY_API_URL: http://identity-api:8080
    EQUIPMENT_API_URL: http://equipment-api:8080
    MAINTENANCE_API_URL: http://maintenance-api:8080
    BILLING_API_URL: http://billing-api:8080
    ENERGY_API_URL: http://energy-api:8080
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  networks: [app, data]
  restart: unless-stopped
  profiles: [backend, full]
  depends_on:
    migrate: { condition: service_completed_successfully }
    localstack: { condition: service_healthy }

x-web: &web                   # one Next.js app per entry point (service/web/<name>, service/web/Dockerfile, IR178)
  environment: &web-env
    DATA_SOURCE: mock            # Phase 1A demo: screens keep their fixture data
    CUSTOMER_WEB_URL: http://localhost:3000
    PARTNER_WEB_URL: http://localhost:3001
    TECHNICIAN_WEB_URL: http://localhost:3002
    ADMIN_WEB_URL: http://localhost:3003
  read_only: true
  security_opt: [no-new-privileges:true]
  networks: [edge]

x-web-api-env: &web-api-env
  <<: *web-env
  DATA_SOURCE: api
  CORE_API_URL: http://gateway:8080
  SESSION_SECRET: local-dev-session-secret-change-me
  OIDC_ISSUER: http://localhost:8081/realms/ac
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/ac
  SESSION_STORE_URL: redis://valkey:6379

services:
  # ------------------------------------------------------------------ web apps (Next.js, one per entry point)
  customer-web:           # demo (mock data) — client entry point
    <<: *web
    image: ac-customer-web:dev
    build: { context: ./service/web, args: { APP: customer } }
    ports: ["3000:3000"]
    tmpfs: [/tmp, /app/customer/.next/cache]
    profiles: [demo]

  customer-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-customer-web:dev
    build: { context: ./service/web, args: { APP: customer } }
    ports: ["3000:3000"]
    tmpfs: [/tmp, /app/customer/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3000
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: [gateway, keycloak, valkey]

  partner-web:           # demo (mock data) — contractor entry point
    <<: *web
    image: ac-partner-web:dev
    build: { context: ./service/web, args: { APP: partner } }
    ports: ["3001:3000"]
    tmpfs: [/tmp, /app/partner/.next/cache]
    profiles: [demo]

  partner-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-partner-web:dev
    build: { context: ./service/web, args: { APP: partner } }
    ports: ["3001:3000"]
    tmpfs: [/tmp, /app/partner/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3001
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: [gateway, keycloak, valkey]

  technician-web:           # demo (mock data) — technician entry point
    <<: *web
    image: ac-technician-web:dev
    build: { context: ./service/web, args: { APP: technician } }
    ports: ["3002:3000"]
    tmpfs: [/tmp, /app/technician/.next/cache]
    profiles: [demo]

  technician-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-technician-web:dev
    build: { context: ./service/web, args: { APP: technician } }
    ports: ["3002:3000"]
    tmpfs: [/tmp, /app/technician/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3002
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: [gateway, keycloak, valkey]

  admin-web:           # demo (mock data) — admin entry point
    <<: *web
    image: ac-admin-web:dev
    build: { context: ./service/web, args: { APP: admin } }
    ports: ["3003:3000"]
    tmpfs: [/tmp, /app/admin/.next/cache]
    profiles: [demo]

  admin-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-admin-web:dev
    build: { context: ./service/web, args: { APP: admin } }
    ports: ["3003:3000"]
    tmpfs: [/tmp, /app/admin/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3003
      OIDC_APP_CLIENT_ID: ac-admin-web
      OIDC_APP_CLIENT_SECRET: local-ac-admin-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: [gateway, keycloak, valkey]

  # ------------------------------------------------------------------ backend (Go + Echo)
  migrate:             # one-off: embedded migrations (cmd/migrate), local login role, demo fixture once
    image: ac-migrate:dev
    build:
      context: ./service/api
      dockerfile: build/migrate.Dockerfile
      target: runtime
    command: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:local@postgres:5432/ac?sslmode=disable
      APP_LOGIN_PASSWORD: local                         # local only: ac_app_login IN ROLE ac_app
      SEED_FIXTURE: /fixture/fixture-contract.json     # local only: skipped when identity.users has rows
    volumes: [./docs/04-agentic-sdlc/fixture-contract.json:/fixture/fixture-contract.json:ro]
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [data]
    profiles: [schema, backend, full]

  gateway:             # Core API entry for the web apps: routes /v1/ops/<operation> to the owning service (IR180)
    image: ac-gateway:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: gateway } }
    environment:
      IDENTITY_API_URL: http://identity-api:8080
      EQUIPMENT_API_URL: http://equipment-api:8080
      MAINTENANCE_API_URL: http://maintenance-api:8080
      BILLING_API_URL: http://billing-api:8080
      ENERGY_API_URL: http://energy-api:8080
    ports: ["8080:8080"]
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [edge, app]
    restart: unless-stopped
    profiles: [backend, full]
    depends_on: [identity-api, equipment-api, maintenance-api, billing-api, energy-api]

  identity-api:        # identity, notifications, audit, demo (internal; reached through the gateway)
    <<: *backend
    image: ac-identity-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: identity-api } }
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  equipment-api:        # units, devices, control, monitoring, read models (internal; reached through the gateway)
    <<: *backend
    image: ac-equipment-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: equipment-api } }
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  maintenance-api:        # jobs, offers, assignments, partners (internal; reached through the gateway)
    <<: *backend
    image: ac-maintenance-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: maintenance-api } }
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  billing-api:        # billing, payments, restrictions (internal; reached through the gateway)
    <<: *backend
    image: ac-billing-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: billing-api } }
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  energy-api:        # energy, MRV, offsets (internal; reached through the gateway)
    <<: *backend
    image: ac-energy-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: energy-api } }
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  webhook:             # planned service (Stripe / SES / WhatsApp receiver); no command yet
    <<: *backend
    image: ac-webhook:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: webhook } }
    ports: ["8082:8080"]
    networks: [edge, app, data]
    profiles: [planned]

  worker-outbox:       { <<: *worker, command: ["/app/worker", "--role=outbox"] }
  worker-scheduler:    { <<: *worker, command: ["/app/worker", "--role=scheduler"] }
  worker-iot:          { <<: *worker, command: ["/app/worker", "--role=iot"] }
  worker-telemetry:    { <<: *worker, command: ["/app/worker", "--role=telemetry"] }
  worker-rollup:       { <<: *worker, command: ["/app/worker", "--role=rollup"] }
  worker-automation:   { <<: *worker, command: ["/app/worker", "--role=automation"] }
  worker-notification: { <<: *worker, command: ["/app/worker", "--role=notification"] }
  worker-importexport: { <<: *worker, command: ["/app/worker", "--role=importexport"] }

  iot-bridge:          # local stand-in for AWS IoT rules: MQTT topics -> Kinesis / SQS
    <<: *backend
    image: ac-api:dev-tools
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: dev, args: { SERVICE: gateway } }
    command: ["/app/iotbridge"]

  device-sim:          # simulated IoT modules (telemetry each minute, heartbeats, command acks)
    <<: *backend
    image: ac-api:dev-tools
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: dev, args: { SERVICE: gateway } }
    command: ["/app/devicesim", "--devices=20"]
    networks: [data]

  # ------------------------------------------------------------------ local stand-ins for AWS services
  postgres:            # Aurora PostgreSQL 16
    image: postgres:16
    environment:
      POSTGRES_DB: ac
      POSTGRES_PASSWORD: local
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d ac"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [data]
    profiles: [infra, schema, backend, full]

  valkey:              # ElastiCache (sessions, idempotency fast path, rate limits)
    image: valkey/valkey:8
    networks: [app, data]
    profiles: [infra, backend, full]

  localstack:          # SQS, SNS, S3, Kinesis, Firehose, Secrets Manager, KMS, SES, EventBridge Scheduler
    image: localstack/localstack:4
    environment:
      SERVICES: sqs,sns,s3,kinesis,firehose,secretsmanager,kms,ses,scheduler,events
      AWS_DEFAULT_REGION: ap-southeast-5
    ports: ["4566:4566"]
    volumes: [./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro]
    healthcheck: { test: ["CMD-SHELL", "curl -fs localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"], interval: 5s, timeout: 3s, retries: 30 }
    networks: [data]
    profiles: [infra, backend, full]

  mosquitto:           # AWS IoT Core stand-in (MQTT 3.1.1/5); mutual TLS is verified in staging against IoT Core
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes: [./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro]
    networks: [data]
    profiles: [infra, backend, full]

  keycloak:            # Amazon Cognito stand-in (OIDC, TOTP); realm "ac" with clients ac-web and ac-admin-web
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081       # fixed issuer for tokens, whoever calls
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # containers may still reach it as keycloak:8080
    ports: ["8081:8080"]
    volumes: [./docker/keycloak/realm-ac.json:/opt/keycloak/data/import/realm-ac.json:ro]
    networks: [edge, app]
    profiles: [infra, backend, full]

  stripe-mock:         # offline Stripe API for tests; use the Stripe CLI (profile stripe) for real test-mode webhooks
    image: stripe/stripe-mock:latest
    networks: [app]
    profiles: [infra, backend, full]

  stripe-cli:
    image: stripe/stripe-cli:latest
    command: ["listen", "--forward-to", "webhook:8080/stripe", "--api-key", "${STRIPE_TEST_SECRET_KEY:-}"]
    networks: [edge]
    profiles: [stripe]

  weather-mock:        # weather source stand-in (WireMock)
    image: wiremock/wiremock:3.9.1
    volumes: [./docker/wiremock:/home/wiremock:ro]
    networks: [app]
    profiles: [infra, backend, full]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    volumes: [./docker/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    networks: [app]
    profiles: [obs]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]
    networks: [app]
    profiles: [obs]

networks:
  edge: {}             # Z1/Z2 stand-in: browser-facing
  app: {}              # Z3 stand-in: application services
  data:                # Z4 stand-in: data services, no published ports in production
    internal: false

volumes:
  pgdata: {}
