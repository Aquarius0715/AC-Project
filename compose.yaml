# AC Project — everything runs in Docker (IR119, DEC-70, docs/02-design/container-design.md)
# Services live under service/: Go in service/api (cmd/{api,worker,migrate} + internal, service/api/build/*.Dockerfile,
# IR174/IR179) and four Next.js apps, one per entry point, in service/web/{customer,partner,technician,admin} on ports
# 3000–3003 with shared code in service/web/shared (service/web/Dockerfile, IR178/IR179)
#
# Profiles
#   demo     Phase 1A clickable demo (4 web apps with the in-browser mock)     docker compose --profile demo up
#   infra    Local stand-ins for the AWS managed services                      docker compose --profile infra up
#   schema   migrate once (schema, local login, demo fixture)                 docker compose --profile infra --profile schema up
#   backend  Core API gateway + 5 domain services, workers, IoT bridge, device simulator (service/api/cmd)
#   full     4 web apps in API mode + backend + infra                         docker compose --profile full up
#   obs      OpenTelemetry collector + Jaeger
#
# Production runs the same application images on ECS Fargate; databases, queues and IoT are AWS managed
# services there (backend-architecture §3a). Nothing in this file is used in production.

name: ac-project

x-worker: &worker             # cmd/worker (independent service, IR166/IR174)
  image: ac-worker:dev
  build:
    context: ./service/api
    dockerfile: build/worker.Dockerfile
    target: runtime
  environment:
    DATABASE_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    DEMO_OPS: "1"                                       # scenario clock shared with the API (platform.demo_clock, IR168)
  read_only: true
  cap_drop: [ALL]               # IR373
  security_opt: [no-new-privileges:true]
  networks: [app, data]
  restart: unless-stopped
  profiles: [backend, full]
  depends_on:
    migrate: { condition: service_completed_successfully }

x-backend: &backend          # Core API business-domain services (service/api/cmd/<service>, build/service.Dockerfile, IR180)
  env_file:
    - path: .env.local
      required: false
  environment: &backend-env
    APP_ENV: local
    DEMO_OPS: "1"                                       # demo.advanceClock / demo.trigger (IR154); never set in production
    DATABASE_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    DATABASE_READER_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
    AWS_REGION: ap-southeast-5
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    OIDC_ISSUER: http://localhost:8081/realms/ac          # must equal the iss claim seen by browsers
    OIDC_JWKS_URL: http://keycloak:8080/realms/ac/protocol/openid-connect/certs
    OIDC_ADMIN_CLIENT_ID: ac-admin-web
    OIDC_APP_CLIENT_ID: ac-web
    MQTT_URL: tcp://mosquitto:1883
    STRIPE_API_BASE: http://stripe-mock:12111
    WEATHER_API_BASE: http://weather-mock:8080          # WireMock GET /v1/current
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    RATE_LIMIT_URL: redis://:${VALKEY_PASSWORD:-local-valkey-only}@valkey:6379                   # write limit per membership, 60 per minute (IR375)
    INTERNAL_API_TOKEN: local-internal-token-change-me   # service-to-service calls (identity principal, IR181)
    IDENTITY_INTERNAL_URL: http://identity-api:8080      # ignored by identity-api itself
    # internal queries between the services (IR190, IR193); a service never calls itself
    IDENTITY_API_URL: http://identity-api:8080
    EQUIPMENT_API_URL: http://equipment-api:8080
    MAINTENANCE_API_URL: http://maintenance-api:8080
    BILLING_API_URL: http://billing-api:8080
    ENERGY_API_URL: http://energy-api:8080
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]               # IR373
  security_opt: [no-new-privileges:true]
  networks: [app, data]
  restart: unless-stopped
  profiles: [backend, full]
  depends_on:
    migrate: { condition: service_completed_successfully }
    localstack: { condition: service_healthy }
    keycloak: { condition: service_healthy }    # the token keys load at start: a service started before the realm answered refused every sign-in (IR419)

x-web: &web                   # one Next.js app per entry point (service/web/<name>, service/web/Dockerfile, IR178)
  environment: &web-env
    DATA_SOURCE: mock            # Phase 1A demo: screens keep their fixture data
    CUSTOMER_WEB_URL: http://localhost:3000
    PARTNER_WEB_URL: http://localhost:3001
    TECHNICIAN_WEB_URL: http://localhost:3002
    ADMIN_WEB_URL: http://localhost:3003
  read_only: true
  cap_drop: [ALL]               # distroless, non-root, a port above 1024: no Linux capability needed (IR373)
  security_opt: [no-new-privileges:true]
  networks: [edge]

x-web-api-env: &web-api-env
  <<: *web-env
  DATA_SOURCE: api
  CORE_API_URL: http://gateway:8080
  SESSION_SECRET: local-dev-session-secret-change-me
  OIDC_ISSUER: http://localhost:8081/realms/ac
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/ac
  SESSION_STORE_URL: redis://:${VALKEY_PASSWORD:-local-valkey-only}@valkey:6379

services:
  # ------------------------------------------------------------------ web apps (Next.js, one per entry point)
  customer-web:           # demo (mock data) — client entry point
    <<: *web
    image: ac-customer-web:dev
    build: { context: ./service/web, args: { APP: customer } }
    ports: ["127.0.0.1:3000:3000"]
    tmpfs: [/tmp, /app/customer/.next/cache]
    profiles: [demo]

  customer-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-customer-web:dev
    build: { context: ./service/web, args: { APP: customer } }
    ports: ["127.0.0.1:3000:3000"]
    tmpfs: [/tmp, /app/customer/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3000
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: { gateway: { condition: service_started }, keycloak: { condition: service_healthy }, valkey: { condition: service_started } }

  partner-web:           # demo (mock data) — contractor entry point
    <<: *web
    image: ac-partner-web:dev
    build: { context: ./service/web, args: { APP: partner } }
    ports: ["127.0.0.1:3001:3000"]
    tmpfs: [/tmp, /app/partner/.next/cache]
    profiles: [demo]

  partner-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-partner-web:dev
    build: { context: ./service/web, args: { APP: partner } }
    ports: ["127.0.0.1:3001:3000"]
    tmpfs: [/tmp, /app/partner/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3001
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: { gateway: { condition: service_started }, keycloak: { condition: service_healthy }, valkey: { condition: service_started } }

  technician-web:           # demo (mock data) — technician entry point
    <<: *web
    image: ac-technician-web:dev
    build: { context: ./service/web, args: { APP: technician } }
    ports: ["127.0.0.1:3002:3000"]
    tmpfs: [/tmp, /app/technician/.next/cache]
    profiles: [demo]

  technician-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-technician-web:dev
    build: { context: ./service/web, args: { APP: technician } }
    ports: ["127.0.0.1:3002:3000"]
    tmpfs: [/tmp, /app/technician/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3002
      OIDC_APP_CLIENT_ID: ac-web
      OIDC_APP_CLIENT_SECRET: local-ac-web-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: { gateway: { condition: service_started }, keycloak: { condition: service_healthy }, valkey: { condition: service_started } }

  admin-web:           # demo (mock data) — admin entry point
    <<: *web
    image: ac-admin-web:dev
    build: { context: ./service/web, args: { APP: admin } }
    ports: ["127.0.0.1:3003:3000"]
    tmpfs: [/tmp, /app/admin/.next/cache]
    profiles: [demo]

  admin-web-api:       # production-like: Server Components / Server Actions call the Core API through the DAL
    <<: *web
    image: ac-admin-web:dev
    build: { context: ./service/web, args: { APP: admin } }
    ports: ["127.0.0.1:3003:3000"]
    tmpfs: [/tmp, /app/admin/.next/cache]
    environment:
      <<: *web-api-env
      APP_URL: http://localhost:3003
      OIDC_APP_CLIENT_ID: ac-admin-web
      OIDC_APP_CLIENT_SECRET: local-ac-admin-secret
    networks: [edge, app]
    profiles: [full]
    depends_on: { gateway: { condition: service_started }, keycloak: { condition: service_healthy }, valkey: { condition: service_started } }

  # ------------------------------------------------------------------ backend (Go + Echo)
  migrate:             # one-off: embedded migrations (cmd/migrate), local login role, demo fixture once
    image: ac-migrate:dev
    build:
      context: ./service/api
      dockerfile: build/migrate.Dockerfile
      target: runtime
    command: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://postgres:local@postgres:5432/ac?sslmode=disable
      APP_LOGIN_PASSWORD: local                         # local only: ac_app_login IN ROLE ac_app
      SEED_FIXTURE: /fixture/fixture-contract.json     # local only: skipped when identity.users has rows
      SEED_MOCK_FLEET: "1"                             # local only: one air conditioner and IoT module per state pattern (internal/devicesim/fleet.json)
    volumes: [./docs/04-agentic-sdlc/fixture-contract.json:/fixture/fixture-contract.json:ro]
    read_only: true
    cap_drop: [ALL]             # IR373
    security_opt: [no-new-privileges:true]
    networks: [data]
    profiles: [schema, backend, full]

  gateway:             # Core API entry for the web apps: forwards each operation's REST route (/v1/…) to the owning service (IR180, IR222)
    image: ac-gateway:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: gateway } }
    environment:
      IDENTITY_API_URL: http://identity-api:8080
      EQUIPMENT_API_URL: http://equipment-api:8080
      MAINTENANCE_API_URL: http://maintenance-api:8080
      BILLING_API_URL: http://billing-api:8080
      ENERGY_API_URL: http://energy-api:8080
    ports: ["127.0.0.1:8080:8080"]   # this machine only: not reachable from other devices on the network (IR373)
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }
    read_only: true
    cap_drop: [ALL]             # IR373
    security_opt: [no-new-privileges:true]
    networks: [edge, app]
    restart: unless-stopped
    profiles: [backend, full]
    depends_on: [identity-api, equipment-api, maintenance-api, billing-api, energy-api]

  identity-api:        # identity, notifications, audit (internal; reached through the gateway)
    <<: *backend
    image: ac-identity-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: identity-api } }
    environment:         # least-privilege login of the domain (IR194)
      <<: *backend-env
      DATABASE_URL: postgres://ac_identity_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_identity_login:local@postgres:5432/ac?sslmode=disable
      # ends a user's identity-provider sessions when HQ signs them out everywhere (IR386); identity-api only
      IDP_TOKEN_URL: http://keycloak:8080/realms/ac/protocol/openid-connect/token
      IDP_ADMIN_URL: http://keycloak:8080/admin/realms/ac
      IDP_ADMIN_CLIENT_ID: ac-identity-admin
      IDP_ADMIN_CLIENT_SECRET: local-identity-admin-08e3e9c976792a4915e39541   # local only; production calls Cognito with identity-api's task role, no secret
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  equipment-api:        # units, devices, control, monitoring, read models (internal; reached through the gateway)
    <<: *backend
    image: ac-equipment-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: equipment-api } }
    environment:         # least-privilege login of the domain (IR194)
      <<: *backend-env
      DATABASE_URL: postgres://ac_equipment_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_equipment_login:local@postgres:5432/ac?sslmode=disable
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  maintenance-api:        # jobs, offers, assignments, partners (internal; reached through the gateway)
    <<: *backend
    image: ac-maintenance-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: maintenance-api } }
    environment:         # least-privilege login of the domain (IR194)
      <<: *backend-env
      DATABASE_URL: postgres://ac_maintenance_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_maintenance_login:local@postgres:5432/ac?sslmode=disable
      BLOB_DIR: /var/lib/ac/blobs   # report photos, certificates, problem attachments (IR229): kept across restarts
    volumes: [blobs:/var/lib/ac/blobs]
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  billing-api:        # billing, payments, restrictions (internal; reached through the gateway)
    <<: *backend
    image: ac-billing-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: billing-api } }
    environment:         # least-privilege login of the domain (IR194)
      <<: *backend-env
      DATABASE_URL: postgres://ac_billing_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_billing_login:local@postgres:5432/ac?sslmode=disable
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  energy-api:        # energy, MRV, offsets (internal; reached through the gateway)
    <<: *backend
    image: ac-energy-api:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: energy-api } }
    environment:         # least-privilege login of the domain (IR194)
      <<: *backend-env
      DATABASE_URL: postgres://ac_energy_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_energy_login:local@postgres:5432/ac?sslmode=disable
    healthcheck: { test: ["CMD", "/app/server", "healthcheck"], interval: 10s, timeout: 3s, retries: 5 }

  webhook:             # planned service (Stripe / SES / WhatsApp receiver); no command yet
    <<: *backend
    image: ac-webhook:dev
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: runtime, args: { SERVICE: webhook } }
    ports: ["127.0.0.1:8082:8080"]   # this machine only: not reachable from other devices on the network (IR373)
    networks: [edge, app, data]
    profiles: [planned]

  worker-outbox:       { <<: *worker, command: ["/app/worker", "--role=outbox"] }
  worker-scheduler-equipment:     # command expiry, diagnostic runs (IR195): equipment's role; billing asked over HTTP
    <<: *worker
    command: ["/app/worker", "--role=scheduler", "--domain=equipment"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://ac_equipment_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_equipment_login:local@postgres:5432/ac?sslmode=disable
  worker-scheduler-maintenance:   # offer / proposal expiry, rating confirmation, history snapshots (IR195)
    <<: *worker
    command: ["/app/worker", "--role=scheduler", "--domain=maintenance"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://ac_maintenance_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_maintenance_login:local@postgres:5432/ac?sslmode=disable
  worker-scheduler-billing:       # the monthly payout drafts on the 1st (IR341): billing's role; maintenance asked over HTTP
    <<: *worker
    command: ["/app/worker", "--role=scheduler", "--domain=billing"]
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://ac_billing_login:local@postgres:5432/ac?sslmode=disable
      DATABASE_READER_URL: postgres://ac_billing_login:local@postgres:5432/ac?sslmode=disable
  worker-iot:          { <<: *worker, command: ["/app/worker", "--role=iot"] }
  worker-telemetry:    { <<: *worker, command: ["/app/worker", "--role=telemetry"] }
  worker-rollup:       { <<: *worker, command: ["/app/worker", "--role=rollup"] }
  worker-automation:   { <<: *worker, command: ["/app/worker", "--role=automation"] }
  worker-notification:   # sends the e-mail notifications and invitations through Mailpit (IR418)
    <<: *worker
    command: ["/app/worker", "--role=notification"]
    environment:
      DATABASE_URL: postgres://ac_app_login:local@postgres:5432/ac?sslmode=disable
      DEMO_OPS: "1"
      MAIL_SMTP_ADDR: mailpit:1025
      MAIL_FROM: AC Project <no-reply@ac-project.local>
    depends_on:
      migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
  worker-importexport: { <<: *worker, command: ["/app/worker", "--role=importexport"] }

  # IoT demo (profile iot): simulated modules publish telemetry and heartbeats, and answer commands, on the broker; the
  # bridge carries the telemetry and the acknowledgements to the demo trigger of the Core API (gateway). Each logs in with
  # its own API key from .env.local (docker/mosquitto/passwd.sh writes the broker's password file from those keys).
  iot-bridge:          # local stand-in for AWS IoT rules: MQTT topics -> the Core API's demo trigger
    image: ac-api:dev-tools
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: dev, args: { SERVICE: gateway } }
    command: ["/app/iotbridge", "--broker", "tcp://mosquitto:1883", "--api", "http://gateway:8080"]
    environment:
      MQTT_USER: iot-bridge
      MQTT_PASSWORD: ${MQTT_IOT_BRIDGE_KEY:?set MQTT_IOT_BRIDGE_KEY in .env.local}
      EQUIPMENT_API_URL: http://equipment-api:8080     # the control domain's internal queries (requested commands)
      INTERNAL_API_TOKEN: local-internal-token-change-me   # the same dev value as the Core API services (backend-env)
    networks: [data, app]
    depends_on: { mosquitto: { condition: service_started }, gateway: { condition: service_healthy }, equipment-api: { condition: service_healthy } }
    profiles: [iot]

  device-sim:          # simulated IoT modules (telemetry each minute, heartbeats, command acks) for the demo fixture devices
    image: ac-api:dev-tools
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: dev, args: { SERVICE: gateway } }
    command: ["/app/devicesim", "--broker", "tcp://mosquitto:1883"]
    environment:
      MQTT_USER: device-sim
      MQTT_PASSWORD: ${MQTT_DEVICE_SIM_KEY:?set MQTT_DEVICE_SIM_KEY in .env.local}
    networks: [data, app]
    depends_on: { mosquitto: { condition: service_started } }
    profiles: [iot]

  mock-history:        # one-off: 30 days of past readings for the mock fleet, up to the scenario clock (charts)
    image: ac-api:dev-tools
    build: { context: ./service/api, dockerfile: build/service.Dockerfile, target: dev, args: { SERVICE: gateway } }
    command: ["/app/mockhistory", "--api", "http://gateway:8080"]
    environment:
      DATABASE_URL: postgres://postgres:local@postgres:5432/ac?sslmode=disable   # local owner login, as migrate uses
      MOCK_HISTORY_DAYS: "30"
    networks: [data, app]
    depends_on: { gateway: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    restart: "no"
    profiles: [iot]

  # ------------------------------------------------------------------ local stand-ins for AWS services
  postgres:            # Aurora PostgreSQL 16
    image: postgres:16@sha256:65b16a8b326e0cfbdf33fa7e783f2a0cb352a61448616ccccfd616ef42aa0f65   # pinned by digest (IR373)
    environment:
      POSTGRES_DB: ac
      POSTGRES_PASSWORD: local
    ports: ["127.0.0.1:5432:5432"]   # this machine only: not reachable from other devices on the network (IR373)
    volumes: [pgdata:/var/lib/postgresql/data]
    cap_drop: [ALL]                  # only what the entrypoint needs to set up the data directory and drop to postgres (security loop, IR414)
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -d ac"], interval: 5s, timeout: 3s, retries: 20 }
    networks: [data]
    profiles: [infra, schema, backend, full]

  valkey:              # ElastiCache (sessions, idempotency fast path, rate limits)
    image: valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd   # pinned by digest (IR373)
    user: "999:999"                # the image's valkey user, not root (security loop, IR414)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-local-valkey-only}"] # local only: the store refuses clients without the password (security loop, IR411)
    ports: ["127.0.0.1:6379:6379"]   # this machine only (IR373): web apps run on the host reach the session store (IR382)
    networks: [app, data]
    profiles: [infra, backend, full]

  localstack:          # SQS, SNS, S3, Kinesis, Firehose, Secrets Manager, KMS, SES, EventBridge Scheduler
    image: localstack/localstack:4@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a   # pinned by digest (IR373)
    environment:
      SERVICES: sqs,sns,s3,kinesis,firehose,secretsmanager,kms,ses,scheduler,events
      AWS_DEFAULT_REGION: ap-southeast-5
    ports: ["127.0.0.1:4566:4566"]   # this machine only: not reachable from other devices on the network (IR373)
    volumes: [./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro]
    healthcheck: { test: ["CMD-SHELL", "curl -fs localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"], interval: 5s, timeout: 3s, retries: 30 }
    networks: [data]
    profiles: [infra, backend, full]

  mosquitto:           # AWS IoT Core stand-in (MQTT 3.1.1/5); mutual TLS is verified in staging against IoT Core
    image: eclipse-mosquitto:2@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408   # pinned by digest (IR373)
    user: "1883:1883"              # the image's mosquitto user, not root (security loop, IR414)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:1883:1883"]   # this machine only: not reachable from other devices on the network (IR373)
    volumes: [./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro, ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro]
    networks: [data]
    profiles: [infra, backend, full]

  mailpit:             # Amazon SES stand-in for development: catches every e-mail (SMTP 1025) and shows it at
                       # http://localhost:8025; nothing leaves the machine (IR418)
    image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a   # pinned (IR373)
    user: "1000:1000"              # not root (security loop, IR414)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_MAX_MESSAGES: "2000"
    ports: ["127.0.0.1:8025:8025"]   # the web inbox, this machine only (IR373)
    networks: [app]
    profiles: [infra, backend, full]

  keycloak:            # Amazon Cognito stand-in (OIDC, TOTP); realm "ac" with clients ac-web and ac-admin-web
    image: quay.io/keycloak/keycloak:26.0@sha256:09a381c715ab0b111835b70f2905955274843a219c6f27efb348e4d9f4086858   # pinned by digest (IR373)
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8081       # fixed issuer for tokens, whoever calls
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"  # containers may still reach it as keycloak:8080
    ports: ["127.0.0.1:8081:8080"]   # this machine only: not reachable from other devices on the network (IR373)
    volumes: [./docker/keycloak/realm-ac.json:/opt/keycloak/data/import/realm-ac.json:ro]
    healthcheck:   # healthy once realm ac answers its discovery document (the image has bash, not curl)
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/ac/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [edge, app]
    profiles: [infra, backend, full]

  stripe-mock:         # offline Stripe API for tests; use the Stripe CLI (profile stripe) for real test-mode webhooks
    image: stripe/stripe-mock:v0.206.0@sha256:aeb96b83e87a893d2ac005e363ac01ffa6e59a5ad85b49c155dfc9129de02e78   # pinned (IR373)
    user: "1000:1000"              # not root (security loop, IR414)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [app]
    profiles: [infra, backend, full]

  stripe-cli:
    image: stripe/stripe-cli:v1.53.1@sha256:11c46caeead82e329f14823dd622d494b4cc8c1b9766f724d122d2af42c97540   # pinned (IR373)
    command: ["listen", "--forward-to", "webhook:8080/stripe", "--api-key", "${STRIPE_TEST_SECRET_KEY:-}"]
    networks: [edge]
    profiles: [stripe]

  weather-mock:        # weather source stand-in (WireMock)
    image: wiremock/wiremock:3.9.1@sha256:8fe02bc3f9b63deb1454d41750dbaf081adf4b3e8c74fd8e31f790bee5647b88   # pinned by digest (IR373)
    user: "1000:1000"              # not root (security loop, IR414)
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [./docker/wiremock:/home/wiremock:ro]
    networks: [app]
    profiles: [infra, backend, full]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0@sha256:a2a52e43c1a80aa94120ad78c2db68780eb90e6d11c8db5b3ce2f6a0cc6b5029
    volumes: [./docker/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    networks: [app]
    profiles: [obs]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
    ports: ["127.0.0.1:16686:16686"]   # this machine only: not reachable from other devices on the network (IR373)
    networks: [app]
    profiles: [obs]

networks:
  edge: {}             # Z1/Z2 stand-in: browser-facing
  app: {}              # Z3 stand-in: application services
  data:                # Z4 stand-in: data services, no published ports in production
    internal: false

volumes:
  pgdata: {}
  blobs: {}            # maintenance-api local blob store (development; S3 in staging and production)
