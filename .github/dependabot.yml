# Pinned versions (actions by SHA, images by digest, modules and packages by lock file) do not move on their own:
# Dependabot proposes the updates as pull requests every week, each checked by CI and E2E.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      # the calendar-versioned LocalStack images (2026.x) need an account auth token and exit at start without one
      # (E2E of the 4 → 2026.9.1 proposal): the stack stays on the free 4.x line
      - dependency-name: localstack/localstack
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: [/service/api/build, /service/web]
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /service/api
    schedule: { interval: weekly }
    groups: { go: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /service/web
    schedule: { interval: weekly }
    groups: { web: { patterns: ["*"], update-types: [minor, patch] } }
    open-pull-requests-limit: 5
