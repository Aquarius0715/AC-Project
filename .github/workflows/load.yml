# Load test of the Core API (docs/02-design/backend-go-design.md, load tests): k6 against a throwaway copy of the backend,
# the compose project ac-load (deploy/load/compose.load.yaml), filled with the launch size of backend-architecture §13
# (600 customers, 3,000 units, 300 synthetic accounts). It runs by hand only (Actions > Load test > Run workflow): never
# on a schedule or on a push, because a run loads the lab server.
#
# It runs on the lab server's self-hosted runner (label ac-test), beside the server's own services and the shared test
# environment, in the same one-at-a-time queue as the end-to-end tests (concurrency group e2e-lab-server): a load run and
# an E2E run never overlap. The ac-load stack publishes no port and has its own database, identity provider and broker, so
# it does not touch ac-test (3200-3203) or the real MQTT broker; it is removed at the end. The server's other services
# still share its CPU and memory with a run, so run it when the shared test environment is idle. The numbers are
# measurements on the lab server, not a guarantee of production performance (the thresholds are the PROPOSED values of
# backend-architecture §13).
name: Load test

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "API: smoke (1 min, must have no error), load (15 min, 300 users, §13 thresholds), stress (to 1,500 users, records only). Web apps: web-smoke (1 min, no error), web (15 min, 285 users), spike (11 min, a sign-in rush), soak (2 hours). IoT path: iot-smoke (1.5 min, no error), iot (10 min, 3,000 devices a minute), iot-design (10 min, 333 batches a second)"
        type: choice
        options: [smoke, load, stress, web-smoke, web, spike, soak, iot-smoke, iot, iot-design]
        default: smoke

permissions:
  contents: read

concurrency:
  group: e2e-lab-server   # one stack at a time on the server, shared with e2e.yml
  cancel-in-progress: false

jobs:
  load:
    name: k6 (compose project ac-load)
    runs-on: [self-hosted, ac-test]
    timeout-minutes: 210   # the 2-hour soak, and the images and the stack before it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build, start, fill, run k6, remove
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          LOAD_OUT=$RUNNER_TEMP/load-out
          echo "LOAD_OUT=$LOAD_OUT" >>"$GITHUB_ENV"
          LOAD_OUT=$LOAD_OUT sh deploy/load/run.sh "$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: load-${{ inputs.scenario }}
          path: |
            ${{ env.LOAD_OUT }}/summary.json
            ${{ env.LOAD_OUT }}/k6.log
            ${{ env.LOAD_OUT }}/postgres.csv
            ${{ env.LOAD_OUT }}/iotload.json
            ${{ env.LOAD_OUT }}/iotload.log
            ${{ env.LOAD_OUT }}/compose-logs.txt
          if-no-files-found: warn
          retention-days: 30
      - name: nothing of ac-load is left
        if: always()
        run: |
          left=$(docker ps -a --filter "label=com.docker.compose.project=ac-load" -q; docker volume ls -q --filter "label=com.docker.compose.project=ac-load"; docker network ls -q --filter "label=com.docker.compose.project=ac-load")
          if [ -n "$left" ]; then docker compose -p ac-load down --volumes --remove-orphans || true; echo "::error title=ac-load was not removed::$left"; exit 1; fi
      - name: remove the replaced images and trim the build cache
        if: always()
        # the replaced :load builds (untagged) and the build cache over 20 GB, as deploy.sh and e2e.yml do (IR725).
        # Tagged images and volumes, of any project, stay
        run: |
          docker image prune -f >/dev/null || true
          docker builder prune -f --max-used-space 20GB >/dev/null || true
