# Lint and tests of the whole repository on every push and pull request. Each check is its own job: Go lint (format, vet,
# golangci-lint, generated files and the API description), the Go suite (unit + integration on one server), the integration suite
# against the split services, the web lint (type-aware, no warnings allowed) per workspace, web dead code (knip), Python, shell, workflows and Dockerfiles, web typecheck, web unit tests, and the design document validators. The
# end-to-end suite needs the whole compose stack and runs in e2e.yml.
#
# The jobs run on GitHub-hosted runners (ubuntu-latest, IR732), each in a container of its own (golang, node, python), so
# the toolchains are the ones the development stack uses. No pull request job runs on the lab server: a pull request from
# a fork would run its own code there. The Go module and build caches and the npm and pip caches are kept between runs
# with actions/cache, keyed by the lock files. Every job starts on its own runner at once, so the run lasts about as long
# as its longest job. Each job has a timeout (45 minutes for the Go suites, 30 for the rest): a hung step (a database that
# never answers) otherwise holds a required check pending for GitHub's six hours and the pull request with it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # every push to main runs to the end

env:
  GOTOOLCHAIN: auto

defaults:
  run:
    shell: bash # a job container's default shell is sh, and the Go suites' steps use pipefail

jobs:
  go-lint:
    name: Go lint (gofmt, vet, golangci-lint, generated files, Swagger)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "golang:1.26-trixie" }
    defaults: { run: { working-directory: service/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
            /root/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('service/api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: python3 (make swagger), and git trusts the workspace
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null
          # the runner's user owns the workspace and the container works as root: without this git takes it for no
          # repository, and the generated-files check's git diff only prints its usage (exit 129)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (every linter and formatter, .golangci.yml; staticcheck among them)
        run: make lint
      - name: generated files are current (catalog, routes, contracts, Swagger)
        run: |
          go run ./cmd/gen/ops
          make swagger
          git diff --exit-code -- . ../web/shared/lib ../../docs/02-design/api

  go-test:
    name: Go tests (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: { image: "golang:1.26-trixie" }
    services:
      postgres: # reached through socat at localhost:5432 (below), where the tests look
        image: postgres:18
        env: { POSTGRES_PASSWORD: local }
        # the data directory in memory (IR725): the databases are thrown away after the job, and the image's VOLUME
        # leaves no anonymous volume behind; 2g only caps a runaway
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:local@localhost:5432/postgres?sslmode=disable
      # the runner's user owns the workspace and the container works as root, so git takes it for no repository: go
      # list of the main packages then fails at their VCS stamp ("error obtaining VCS status"), which tests never need
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
            /root/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('service/api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: the database at localhost:5432, where the tests look (socat to the service)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client socat >/dev/null
          setsid nohup socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432 >/dev/null 2>&1 &
          until pg_isready -q -h localhost -p 5432; do sleep 1; done
      - name: test databases (ac_test for the packages, one per integration shard)
        working-directory: service/api
        run: |
          make testdb
          SHARDS=3 RESET=only sh scripts/test-shards.sh
      - name: go test
        working-directory: service/api
        # the packages and the integration suite's three shards at once, each on its own database; a failing test's
        # lines also become annotations, readable on the run without the logs (like the E2E's reporter)
        run: |
          rp=0 ri=0
          # shellcheck disable=SC2046 # the package list splits into words, one per package
          go test -count=1 -timeout 30m $(go list ./... | grep -v /test/) > packages.log 2>&1 & p=$!
          SHARDS=3 RESET=0 sh scripts/test-shards.sh > integration.log 2>&1 || ri=$?
          wait $p || rp=$?
          cat packages.log integration.log > go-test.log
          cat go-test.log
          if [ "$rp" != 0 ] || [ "$ri" != 0 ]; then
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' go-test.log | head -40 | sed 's/%/%25/g; s/^/::error title=go test::/'
            exit 1
          fi

  go-test-cluster:
    name: Go integration tests (split services)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: { image: "golang:1.26-trixie" }
    services:
      postgres: # reached through socat at localhost:5432 (below), where the tests look
        image: postgres:18
        env: { POSTGRES_PASSWORD: local }
        # the data directory in memory (IR725): the databases are thrown away after the job, and the image's VOLUME
        # leaves no anonymous volume behind; 2g only caps a runaway
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=2g
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:local@localhost:5432/postgres?sslmode=disable
      # the runner's user owns the workspace and the container works as root, so git takes it for no repository: go
      # list of the main packages then fails at their VCS stamp ("error obtaining VCS status"), which tests never need
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /go/pkg/mod
            /root/.cache/go-build
            /root/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ hashFiles('service/api/go.sum') }}
          restore-keys: go-${{ runner.os }}-
      - name: the database at localhost:5432, where the tests look (socat to the service)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client socat >/dev/null
          setsid nohup socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432 >/dev/null 2>&1 &
          until pg_isready -q -h localhost -p 5432; do sleep 1; done
      - name: test databases (one per shard)
        working-directory: service/api
        run: SHARDS=3 CLUSTER=1 RESET=only sh scripts/test-shards.sh
      - name: go test (cluster)
        working-directory: service/api
        # the suite's three shards at once; a failing test's lines also become annotations, readable on the run without
        # the logs (like the E2E's reporter)
        run: |
          set -o pipefail
          SHARDS=3 CLUSTER=1 RESET=0 sh scripts/test-shards.sh 2>&1 | tee go-test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' go-test.log | head -40 | sed 's/%/%25/g; s/^/::error title=go test (cluster)::/'
            exit 1
          }

  web-knip:
    name: Web dead code (knip)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "node:26-bookworm" }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('service/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: dead code and unused dependencies (knip.jsonc)
        run: npm run knip

  # The web lint (type-aware, CLAUDE.md 5) of each workspace and of the e2e specs, one job each: together they take about twelve
  # minutes, so they run side by side instead of one after the other. Each app's lint runs `next typegen` first, because the
  # route types it writes are what the lint reads PageProps from.
  web-lint:
    name: Web lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "node:26-bookworm" }
    defaults: { run: { working-directory: service/web } }
    strategy:
      fail-fast: false   # every workspace reports, whichever fails
      matrix:
        workspace: [shared, customer, partner, technician, admin, portal, e2e]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('service/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: lint
        run: |
          if [ "${{ matrix.workspace }}" = e2e ]; then
            npx eslint --max-warnings=0 -c e2e/eslint.config.mjs e2e
            npx eslint --max-warnings=0 -c load/eslint.config.mjs load   # the k6 scenarios share this job (its name is a required check)
          else
            npm run lint --workspace=${{ matrix.workspace }}
          fi

  # Python (ruff, ruff.toml), shell scripts (shellcheck), the workflows (actionlint, with the shell they run, and zizmor) and the Dockerfiles
  # (hadolint), through the PyPI packages that carry each tool's binary; the versions are pinned. Nothing here needs the other jobs.
  other-lint:
    name: Python, shell, workflows and Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "python:3.13-bookworm" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-
      - run: pip install ruff==0.17.3 shellcheck-py==0.11.0.1 actionlint-py==1.7.12.25 hadolint-py==2.15.1.3 zizmor==1.31.1
      - run: ruff check .
      - run: find . -name '*.sh' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 shellcheck
      - run: sh docker/mosquitto/passwd.test.sh # the broker password script writes the file again when a checkout put the committed one back (IR684)
      - run: python3 -m unittest deploy/test/test_realm.py # the test environment's realm takes its own demo password (IR720)
      - run: actionlint -config-file .github/actionlint.yaml
      - run: zizmor --offline .github/workflows # the workflows' security (IR732): triggers, credentials, permissions, injection
      - run: find . -name '*Dockerfile' -not -path './.git/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 hadolint

  web-typecheck:
    name: Web typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "node:26-bookworm" }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('service/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck

  web-test:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "node:26-bookworm" }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('service/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm test

  docs:
    name: Design document validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: { image: "python:3.12-bookworm" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false } # no later step pushes or fetches with the job's token
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('service/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: TypeScript for the contract check
        run: npm install --no-save --prefix "$RUNNER_TEMP/ts" typescript@6.0.3 # zizmor: ignore[adhoc-packages] the exact version of service/web's lock, for the contract check only
      - name: validate_documents.py
        run: python3 docs/tools/validate_documents.py --tsc "$RUNNER_TEMP/ts/node_modules/typescript/lib/tsc.js"
      - name: check_review_regressions.py
        run: python3 docs/tools/check_review_regressions.py
