# Lint and tests of the whole repository on every push and pull request. Each check is its own job: Go lint (format, vet,
# golangci-lint, generated files and the API description), the Go suite (unit + integration on one server), the integration suite
# against the split services, web lint (no warnings allowed), web typecheck, web unit tests, and the design document validators. The
# end-to-end suite needs the whole compose stack and runs in e2e.yml.
#
# The jobs run on the lab server's self-hosted runner (label ac-test, DEC-94), each in a container of its own: the dependencies'
# code then never runs on the server itself, and the job reaches only its workspace. Docker volumes keep the Go and npm caches
# from one run to the next. A container works as root, so each job hands its workspace back to the runner's user at the end, or
# the next checkout could not clean it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # every push to main runs to the end

env:
  GOTOOLCHAIN: auto

jobs:
  go-lint:
    name: Go lint (gofmt, vet, golangci-lint, generated files, Swagger)
    runs-on: [self-hosted, ac-test]
    container: { image: "golang:1.26-bookworm", volumes: ["ac-ci-go:/go/pkg/mod", "ac-ci-cache:/root/.cache"] }
    defaults: { run: { working-directory: service/api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: python3 (make swagger)
        run: apt-get update -qq && apt-get install -y -qq python3 >/dev/null
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (every linter and formatter, .golangci.yml; staticcheck among them)
        run: make lint
      - name: generated files are current (catalog, routes, contracts, Swagger)
        run: |
          go run ./cmd/gen/ops
          make swagger
          git diff --exit-code -- . ../web/shared/lib ../../docs/02-design/api
      - name: the workspace back to the runner's user
        if: always()
        working-directory: .
        run: chown -R "$(stat -c '%u:%g' .)" .

  go-test:
    name: Go tests (unit + integration)
    runs-on: [self-hosted, ac-test]
    container: { image: "golang:1.26-bookworm", volumes: ["ac-ci-go:/go/pkg/mod", "ac-ci-cache:/root/.cache"] }
    services:
      postgres: # no published port: the server's own PostgreSQL has 5432
        image: postgres:18
        env: { POSTGRES_PASSWORD: local }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:local@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the database at localhost:5432, where the tests look (socat to the service)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client socat >/dev/null
          setsid nohup socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432 >/dev/null 2>&1 &
          until pg_isready -q -h localhost -p 5432; do sleep 1; done
      - name: test database
        working-directory: service/api
        run: |
          make testdb
      - name: go test
        working-directory: service/api
        # a failing test's lines also become annotations, readable on the run without the logs (like the E2E's reporter)
        run: |
          set -o pipefail
          go test -count=1 -timeout 30m ./... 2>&1 | tee go-test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' go-test.log | head -40 | sed 's/%/%25/g; s/^/::error title=go test::/'
            exit 1
          }
      - name: the workspace back to the runner's user
        if: always()
        run: chown -R "$(stat -c '%u:%g' .)" .

  go-test-cluster:
    name: Go integration tests (split services)
    runs-on: [self-hosted, ac-test]
    container: { image: "golang:1.26-bookworm", volumes: ["ac-ci-go:/go/pkg/mod", "ac-ci-cache:/root/.cache"] }
    services:
      postgres: # no published port: the server's own PostgreSQL has 5432
        image: postgres:18
        env: { POSTGRES_PASSWORD: local }
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_ADMIN_URL: postgres://postgres:local@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the database at localhost:5432, where the tests look (socat to the service)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client socat >/dev/null
          setsid nohup socat TCP-LISTEN:5432,fork,reuseaddr TCP:postgres:5432 >/dev/null 2>&1 &
          until pg_isready -q -h localhost -p 5432; do sleep 1; done
      - name: test database
        working-directory: service/api
        run: |
          make testdb-cluster
      - name: go test (cluster)
        working-directory: service/api
        # a failing test's lines also become annotations, readable on the run without the logs (like the E2E's reporter)
        run: |
          set -o pipefail
          AC_TEST_DB=ac_test_cluster AC_TEST_CLUSTER=1 go test -count=1 -timeout 30m ./test/... 2>&1 | tee go-test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' go-test.log | head -40 | sed 's/%/%25/g; s/^/::error title=go test (cluster)::/'
            exit 1
          }
      - name: the workspace back to the runner's user
        if: always()
        run: chown -R "$(stat -c '%u:%g' .)" .

  web-lint:
    name: Web lint (ESLint)
    runs-on: [self-hosted, ac-test]
    container: { image: "node:26-bookworm", volumes: ["ac-ci-npm:/root/.npm"] }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run lint
      - name: the workspace back to the runner's user
        if: always()
        working-directory: .
        run: chown -R "$(stat -c '%u:%g' .)" .

  web-typecheck:
    name: Web typecheck
    runs-on: [self-hosted, ac-test]
    container: { image: "node:26-bookworm", volumes: ["ac-ci-npm:/root/.npm"] }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run typecheck
      - name: the workspace back to the runner's user
        if: always()
        working-directory: .
        run: chown -R "$(stat -c '%u:%g' .)" .

  web-test:
    name: Web unit tests (Vitest)
    runs-on: [self-hosted, ac-test]
    container: { image: "node:26-bookworm", volumes: ["ac-ci-npm:/root/.npm"] }
    defaults: { run: { working-directory: service/web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
      - name: the workspace back to the runner's user
        if: always()
        working-directory: .
        run: chown -R "$(stat -c '%u:%g' .)" .

  docs:
    name: Design document validators
    runs-on: [self-hosted, ac-test]
    container: { image: "python:3.12-bookworm", volumes: ["ac-ci-npm:/root/.npm"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26 }
      - name: TypeScript for the contract check
        run: npm install --no-save --prefix "$RUNNER_TEMP/ts" typescript@6.0.3
      - name: validate_documents.py
        run: python3 docs/tools/validate_documents.py --tsc "$RUNNER_TEMP/ts/node_modules/typescript/lib/tsc.js"
      - name: check_review_regressions.py
        run: python3 docs/tools/check_review_regressions.py
      - name: the workspace back to the runner's user
        if: always()
        run: chown -R "$(stat -c '%u:%g' .)" .
