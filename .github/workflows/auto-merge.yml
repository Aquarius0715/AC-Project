# A pull request of this repository merges into main by itself once every required check has passed: this workflow turns
# on GitHub's auto-merge when the pull request is opened. Which checks are required, and that the branch is up to date with
# main, is the branch protection of main (the 14 jobs of ci.yml); GitHub waits for them and merges, or keeps waiting.
# Only the repository owner's own pull requests get it (IR732): not one from a fork or another account, which the owner
# merges after reading it, nor one of Dependabot (IR727), whose update can need code changes or not be an update at all.
# The trigger is pull_request, never pull_request_target: a fork's pull request runs with a read-only token and no secrets.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  enable:
    name: Turn on auto-merge
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    container: { image: "python:3.13-bookworm" }
    steps:
      - name: ask GitHub to merge the pull request when its required checks pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_ID: ${{ github.event.pull_request.node_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          query = (
              "mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) "
              "{ pullRequest { number } } }"
          )
          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"id": os.environ["PULL_REQUEST_ID"]}}).encode(),
              headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Content-Type": "application/json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              answer = json.load(response)
          print(json.dumps(answer, indent=2))
          if answer.get("errors"):
              raise SystemExit(1)
          PY
