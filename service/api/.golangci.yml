# golangci-lint v2 for the Go backend: every linter and every formatter, at their default settings ("全部入り",
# user request 2026-11-03). Only the deprecated linters are off — their successors exhaustruct_v5, gomodguard_v2 and
# wsl_v5 stay on. A linter that needs the project's own facts gets them below (the modules depguard allows); nolint
# directives must name the linter and say why.
version: "2"
run:
  timeout: 15m
  tests: true
linters:
  default: all
  disable:
    - exhaustruct # deprecated: exhaustruct_v5
    - gomodguard # deprecated: gomodguard_v2
    - wsl # deprecated: wsl_v5
  settings:
    # Size and complexity limits judge whether code is hard to read, not whether a function can be cut smaller: a
    # function is never split into trivial pieces only to pass them (CLAUDE.md, lint rules 4-2). The cyclomatic count
    # adds every case of a flat switch that maps one value to another, so it takes gocyclo's limit (30); gocognit (30)
    # and nestif judge how hard the code is to follow, and the package average keeps the overall level low.
    cyclop:
      max-complexity: 30
      package-average: 10.0
    # statements measure what a function does; a struct literal that names every field (exhaustruct) adds lines only
    funlen:
      lines: 100
      statements: 50
    # Go keeps conventional names short (Go Code Review Comments, "Variable Names"): err, ctx, ok, id, loop indexes and
    # values, tx and db, and the standard parameters of tests and HTTP handlers; hq is the domain's word for
    # headquarters. Other short names must say what they hold when they are used far from their declaration.
    varnamelen:
      ignore-names: [err, ctx, ok, id, i, j, k, n, v, tx, db, hq]
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-decls:
        - t *testing.T
        - b *testing.B
        - w http.ResponseWriter
        - r *http.Request
        - tx pgx.Tx
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/pradita/ac-project/service/api
            - github.com/MicahParks/keyfunc/v3
            - github.com/alicebob/miniredis/v2
            - github.com/eclipse/paho.mqtt.golang
            - github.com/golang-jwt/jwt/v5
            - github.com/google/uuid
            - github.com/jackc/pgx/v5
            - github.com/labstack/echo/v5
            - github.com/redis/go-redis/v9
            - golang.org/x/time
    wrapcheck:
      # the DomainError constructors start an error, as errors.New does; From converts one and keeps its cause.
      # Every other error from another package is wrapped with apperr.Wrap (".Wrap(" is a default ignore-sig)
      extra-ignore-sigs:
        - apperr.E(
        - apperr.Fields(
        - apperr.From(
        - .RetryAfter(
    godot:
      exclude:
        - "^ *@" # swag annotations (@Router, @Param …) are read by swag: a period would change the route
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    rules:
      # swag reads a parameter from one line (name, in, type, required, "description", attributes) and cannot continue
      # it on the next, unlike @Description; the descriptions come from the catalogs (scripts/swag_annotate.py)
      - linters:
          - lll
        source: '^\s*//\s*@Param\s'
      # a test reads as one scenario from its set-up to its assertions; cutting it up only to meet a size or complexity
      # limit hides its steps (CLAUDE.md, lint rules 4-2)
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - maintidx
        path: (_test\.go|^test/)
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/pradita/ac-project)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
