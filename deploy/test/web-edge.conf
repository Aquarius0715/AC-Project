# web-edge (IR855): the shared test environment's apps behind one nginx, so a deployment replaces an app's container
# without closing its port. deploy.sh copies this file to ~/ac-test/web-edge/edge.conf and writes 00-upstreams.conf (read first) next to
# it: each upstream is the app's service name, re-resolved through Docker's DNS, or, while its container is replaced,
# the new container alone; nginx -s reload then lets the requests in flight finish on the old one.
#
# The apps see what they saw when they published their ports themselves: the browser's Host and the browser's own
# headers, nothing added.
resolver 127.0.0.11 valid=5s ipv6=off;
server_tokens off;

# the sealed session cookie and Keycloak's make large headers; Report a problem sends up to 8 MiB to a Server Action
large_client_header_buffers 4 32k;
client_max_body_size 10m;
proxy_buffer_size 32k;
proxy_buffers 8 32k;
proxy_busy_buffers_size 64k;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
proxy_buffering off;           # the pages stream (React Server Components, Suspense)
proxy_read_timeout 300s;

server { listen 3000; location / { proxy_pass http://customer-web-api-pool; } }
server { listen 3001; location / { proxy_pass http://partner-web-api-pool; } }
server { listen 3002; location / { proxy_pass http://technician-web-api-pool; } }
server { listen 3003; location / { proxy_pass http://admin-web-api-pool; } }
server { listen 3004; location / { proxy_pass http://portal-web-pool; } }
